
<!DOCTYPE html>
<html>
<head>
    <title>Snake and Ladder Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8f0fe;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #263238;
            margin-bottom: 20px;
        }

        .game-container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            border: 3px solid #333;
            margin: 20px auto;
            max-width: 500px;
        }

        .cell {
            aspect-ratio: 1;
            border: 1px solid #aaa;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3px;
            font-size: 12px;
            position: relative;
        }

        .cell:nth-child(odd) {
            background: #d8f3dc;
        }

        .cell:nth-child(even) {
            background: #ffe8a1;
        }

        .number {
            font-weight: bold;
            align-self: flex-start;
        }

        .special {
            font-size: 17px;
        }

        .tokens {
            display: flex;
            gap: 2px;
            font-size: 16px;
            position: absolute;
            bottom: 3px;
        }

        .player-info {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .player {
            padding: 10px;
            border-radius: 8px;
            background: #eee;
        }

        .active {
            outline: 3px solid #2563eb;
        }

        .red {
            color: #e53935;
        }

        .blue {
            color: #1565c0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            margin: 8px;
        }

        button:hover {
            background: #1746a2;
        }

        #dice {
            font-size: 35px;
            margin: 10px;
        }

        #message {
            margin: 15px;
            font-weight: bold;
            color: #333;
        }

        @media(max-width: 450px) {
            body {
                padding: 8px;
            }

            .game-container {
                padding: 8px;
            }

            .cell {
                font-size: 9px;
            }

            .special {
                font-size: 12px;
            }

            .tokens {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake & Ladder 🪜</h1>

    <div class="player-info">

        <div class="player active" id="p1">
            <span class="red">🔴 Player 1</span>
            <p>Position: <span id="pos1">0</span></p>
        </div>

        <div class="player" id="p2">
            <span class="blue">🔵 Player 2</span>
            <p>Position: <span id="pos2">0</span></p>
        </div>

    </div>

    <div id="board"></div>

    <div id="dice">🎲</div>

    <p id="message">Player 1's Turn! Roll the dice.</p>

    <button onclick="rollDice()">Roll Dice</button>

    <button onclick="restartGame()">Restart Game</button>

</div>


<script>

// 1. Game variables

let player1 = 0;
let player2 = 0;

let currentPlayer = 1;
let gameOver = false;


// 2. Snakes and ladders

const snakes = {
    99: 54,
    70: 55,
    52: 42,
    25: 2,
    95: 72
};

const ladders = {
    4: 14,
    9: 31,
    20: 38,
    28: 84,
    40: 59,
    63: 81
};


// 3. Create board

const board = document.getElementById("board");

function createBoard() {

    board.innerHTML = "";

    for (let row = 9; row >= 0; row--) {

        for (let col = 0; col < 10; col++) {

            let number;

            if (row % 2 === 1) {
                number = row * 10 + (10 - col);
            } else {
                number = row * 10 + col + 1;
            }

            let cell = document.createElement("div");

            cell.className = "cell";
            cell.id = "cell-" + number;

            let label = document.createElement("span");

            label.className = "number";
            label.innerText = number;

            cell.appendChild(label);

            if (snakes[number]) {
                let icon = document.createElement("span");
                icon.className = "special";
                icon.innerText = "🐍";
                cell.appendChild(icon);
            }

            if (ladders[number]) {
                let icon = document.createElement("span");
                icon.className = "special";
                icon.innerText = "🪜";
                cell.appendChild(icon);
            }

            board.appendChild(cell);
        }
    }

    updateBoard();
}


// 4. Update player positions

function updateBoard() {

    document.getElementById("pos1").innerText = player1;
    document.getElementById("pos2").innerText = player2;

    document.querySelectorAll(".tokens").forEach(
        token => token.remove()
    );

    if (player1 > 0) {
        addToken(player1, "🔴");
    }

    if (player2 > 0) {
        addToken(player2, "🔵");
    }

    document.getElementById("p1").classList.toggle(
        "active", currentPlayer === 1 && !gameOver
    );

    document.getElementById("p2").classList.toggle(
        "active", currentPlayer === 2 && !gameOver
    );
}


// 5. Add player token

function addToken(position, color) {

    let cell = document.getElementById("cell-" + position);

    let tokens = cell.querySelector(".tokens");

    if (!tokens) {
        tokens = document.createElement("div");
        tokens.className = "tokens";
        cell.appendChild(tokens);
    }

    let token = document.createElement("span");

    token.innerText = color;

    tokens.appendChild(token);
}


// 6. Roll dice

function rollDice() {

    if (gameOver) return;

    let dice = Math.floor(Math.random() * 6) + 1;

    document.getElementById("dice").innerText =
        "🎲 " + dice;

    let message = document.getElementById("message");

    let oldPosition =
        currentPlayer === 1 ? player1 : player2;

    let newPosition = oldPosition + dice;

    if (newPosition > 100) {

        message.innerText =
            "You need exact number to reach 100!";

    } else {

        if (currentPlayer === 1) {
            player1 = newPosition;
        } else {
            player2 = newPosition;
        }

        // Check ladder

        if (ladders[newPosition]) {

            newPosition = ladders[newPosition];

            message.innerText =
                "Great! You climbed a ladder! 🪜";

        }

        // Check snake

        else if (snakes[newPosition]) {

            newPosition = snakes[newPosition];

            message.innerText =
                "Oops! A snake caught you! 🐍";

        }

        // Update final position

        if (currentPlayer === 1) {
            player1 = newPosition;
        } else {
            player2 = newPosition;
        }

    }

    // Check winner

    let position =
        currentPlayer === 1 ? player1 : player2;

    if (position === 100) {

        message.innerText =
            "🎉 Player " + currentPlayer + " Wins!";

        gameOver = true;

    } else {

        currentPlayer = currentPlayer === 1 ? 2 : 1;

        if (newPosition <= 100 && newPosition > oldPosition) {
            // Keep the snake/ladder message if applicable
        } else if (newPosition === oldPosition) {
            message.innerText += " Turn passed.";
        } else if (!snakes[position] && !ladders[position]) {
            message.innerText =
                "Player " + currentPlayer + "'s Turn!";
        }
    }

    updateBoard();
}


// 7. Restart game

function restartGame() {

    player1 = 0;
    player2 = 0;

    currentPlayer = 1;
    gameOver = false;

    document.getElementById("dice").innerText = "🎲";

    document.getElementById("message").innerText =
        "Player 1's Turn! Roll the dice.";

    updateBoard();
}


// Start game

createBoard();

</script>

</body>
</html>
