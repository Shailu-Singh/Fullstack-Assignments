
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>😂 Joke Generator</h1>

        <p class="subtitle">
            Need a little laugh? Get a random joke!
        </p>

        <div class="joke-card">

            <div class="emoji">🤣</div>

            <h2 id="jokeTitle">Ready for a joke?</h2>

            <p id="jokeText">
                Click the button below to get your first joke.
            </p>

            <button id="jokeBtn">
                Get New Joke 😂
            </button>

            <p id="status"></p>

        </div>

        <footer>
            Made with HTML, CSS & JavaScript
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
