
<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Chessboard</title>
</head>

<body>

<script>

// 1. Create main container
let container = document.createElement("div");

container.style.width = "500px";
container.style.margin = "30px auto";
container.style.textAlign = "center";
container.style.fontFamily = "Arial";

// 2. Create heading
let heading = document.createElement("h1");

heading.innerText = "Chess Board";
heading.style.color = "#333";
heading.style.marginBottom = "20px";

container.appendChild(heading);

// 3. Create chessboard
let board = document.createElement("div");

board.style.display = "grid";
board.style.gridTemplateColumns = "repeat(8, 1fr)";
board.style.width = "400px";
board.style.height = "400px";
board.style.border = "4px solid #333";
board.style.margin = "auto";

// 4. Create 64 squares dynamically
for (let row = 0; row < 8; row++) {

    for (let col = 0; col < 8; col++) {

        let square = document.createElement("div");

        // Alternate colors
        if ((row + col) % 2 === 0) {
            square.style.backgroundColor = "#f0d9b5";
        } else {
            square.style.backgroundColor = "#b58863";
        }

        square.style.display = "flex";
        square.style.alignItems = "center";
        square.style.justifyContent = "center";
        square.style.fontSize = "35px";
        square.style.cursor = "pointer";

        // Chess pieces
        let pieces = [
            ["♜","♞","♝","♛","♚","♝","♞","♜"],
            ["♟","♟","♟","♟","♟","♟","♟","♟"],
            ["","","","","","","",""],
            ["","","","","","","",""],
            ["","","","","","","",""],
            ["","","","","","","",""],
            ["♙","♙","♙","♙","♙","♙","♙","♙"],
            ["♖","♘","♗","♕","♔","♗","♘","♖"]
        ];

        square.innerText = pieces[row][col];

        // Add square to board
        board.appendChild(square);
    }
}

// 5. Add board to container
container.appendChild(board);

// 6. Add container to body
document.body.appendChild(container);

</script>

</body>
</html>
